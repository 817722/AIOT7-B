spring.application.name=project

# 데이터베이스 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/project
spring.datasource.username=aloha
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# ddl-auto : create / update / validate / none
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# 로깅
spring.output.ansi.enabled=ALWAYS
logging.level.root=INFO
logging.level.com.aloha.project=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n


# 국세청 사업자등록정보 진위확인 API
nts.api.base-url=https://api.odcloud.kr/api/nts-businessman/v1
nts.api.service-key=${ODCLOUD_SERVICE_KEY:}

# 사업자 인증 Mock 사용 여부 (기본값: 실제 국세청 API 호출)
# 발표용으로 실행할 때는 --spring.profiles.active=demo 를 사용한다.
nts.api.mock-enabled=false
