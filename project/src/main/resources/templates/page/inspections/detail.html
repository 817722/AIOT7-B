<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교량점검 시스템</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/inspection-v2.css}" href="/css/inspection-v2.css">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="app-layout" th:with="activeMenu='inspections'">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="app-main inspection-v2" id="main-content">
            <div class="app-container">
                <!-- 서브메뉴 -->
                <div th:replace="~{fragments/submenu :: submenu(activeMenu='/inspections/5')}"></div>
                <h1 class="bv-title">점검 상세</h1>
                <p class="app-page-description">공통 헤더와 사이드바 연결 테스트 화면입니다.</p>

                <section class="app-grid" aria-label="화면 구성 미리보기">
                    <div class="app-card"><div class="app-stat-label">등록 교량</div><div class="app-stat-value">--</div></div>
                    <div class="app-card"><div class="app-stat-label">점검 진행 중</div><div class="app-stat-value">--</div></div>
                    <div class="app-card"><div class="app-stat-label">점검 완료</div><div class="app-stat-value">--</div></div>
                </section>
                <section class="app-card" style="margin-top:20px">
                    <h2 class="app-card__title">교량 목록</h2>
                    <p>공통 레이아웃이 정상적으로 표시된다면 1단계가 완료된 것입니다.</p>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
