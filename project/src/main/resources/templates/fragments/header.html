<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 모든 업무 페이지에서 th:replace="~{fragments/header :: header}" 사용 -->
<header th:fragment="header" class="app-header">
    <a class="app-brand" th:href="@{/bridges}" href="/bridges" aria-label="교량 목록으로 이동">
        <svg class="app-brand__icon" viewBox="0 0 40 40" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 8V32M33 8V32M7 18L20 27L33 18M7 13L20 22L33 13"
                  stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M4 33H36" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </svg>
        <span class="app-brand__name">교량점검 시스템</span>
    </a>

    <!-- 비로그인 상태(로그인/회원가입 페이지)에는 계정 메뉴를 표시하지 않음 -->
    <div class="app-header__account" th:if="${currentWorkerName != null}">
        <span class="app-header__worker" aria-label="현재 로그인한 작업자">
            <span class="app-header__worker-label">작업자</span>
            <strong class="app-header__worker-name" th:text="${currentWorkerName}">김가람</strong>
        </span>
        <!-- CSRF를 유지하는 POST 로그아웃: SecurityConfig의 /users/logout과 일치 -->
        <form class="app-header__logout-form" th:action="@{/users/logout}" action="/users/logout" method="post">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="app-header__logout" type="submit">로그아웃</button>
        </form>
    </div>
</header>
</body>
</html>
