<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 모든 업무 페이지에서 th:replace="~{fragments/sidebar :: sidebar}" 사용 -->
<aside th:fragment="sidebar" class="app-sidebar" aria-label="업무 관리 메뉴">
    <div class="app-sidebar__heading">업무 관리</div>
    <nav class="app-sidebar__nav" aria-label="주 메뉴">
        <a class="app-sidebar__link"
           th:classappend="${activeMenu == 'bridges'} ? 'is-active' : ''"
           th:href="@{/bridges}" href="/bridges">교량 관리</a>
        <a class="app-sidebar__link"
           th:classappend="${activeMenu == 'inspections'} ? 'is-active' : ''"
           th:href="@{/inspections}" href="/inspections">점검 관리</a>
        <a class="app-sidebar__link"
           th:classappend="${activeMenu == 'maintenances'} ? 'is-active' : ''"
           th:href="@{/maintenances}" href="/maintenances">유지보수 관리</a>
        <!-- 관리자 메뉴: 권한별로 표시(INSPECTOR는 표시하지 않음).
             메뉴 숨김은 화면 표시용이며, 실제 접근 제한은 SecurityConfig(/admin/**, /corps/**)와 Controller/Service에서 검증 -->
        <a class="app-sidebar__link" th:if="${currentUserRole == 'ADMIN'}"
           th:classappend="${activeMenu == 'corps'} ? 'is-active' : ''"
           th:href="@{/corps}" href="/corps">기업 관리 · 검수</a>
        <a class="app-sidebar__link" th:if="${currentUserRole == 'SUPER_ADMIN'}"
           th:classappend="${activeMenu == 'admin'} ? 'is-active' : ''"
           th:href="@{/admin}" href="/admin">웹 관리자</a>

        <!-- 다음 세 페이지의 실제 Controller URL은 팀원의 라우트 확인 후 연결 -->
        <!-- <span class="app-sidebar__link app-sidebar__link--pending"
              aria-disabled="true" title="점검 관리 URL 연동 대기">점검 관리</span>
        <span class="app-sidebar__link app-sidebar__link--pending"
              aria-disabled="true" title="유지보수 관리 URL 연동 대기">유지보수 관리</span>
        <span class="app-sidebar__link app-sidebar__link--pending"
              aria-disabled="true" title="관리자 검수 URL 연동 대기">관리자 검수</span> -->
    </nav>
</aside>
</body>
</html>
