<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교량점검 시스템</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/inspection-v2.css}" href="/css/inspection-v2.css">
    <script th:src="@{/js/inspection-v2-form.js}" src="/js/inspection-v2-list.js" defer></script>>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="app-layout" th:with="activeMenu='inspections'">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="app-main inspection-v2" id="main-content">
            <div class="app-container">
                <!-- 서브메뉴 -->
                <div th:replace="~{fragments/submenu :: submenu(activeMenu='/inspections')}"></div>
                <h1 class="bv-title">점검 목록</h1>
                <p class="app-page-description">교량별 점검 기록을 조회합니다.</p>

                <section class="bv-panel bv-figma-panel" aria-labelledby="bv-overview-title">
                  <div class="bv-section-heading bv-figma-section-heading">
                      <h2 id="bv-overview-title" class="bv-panel-title">점검 현황</h2>
                      <!-- 점검 등록 페이지 이동 -->
                      <a class="bv-btn bv-btn-primary" th:href="@{/inspections/new}">점검 등록</a>
                  </div>

                  <!-- 점검 상태별 탭 (경로를 /inspections 로 통일) -->
                  <nav class="bv-tabs bv-figma-tabs" aria-label="점검 상태별 목록">
                      <a th:classappend="${#strings.isEmpty(status)} ? ' is-active' : ''"
                        th:href="@{/inspections(keyword=${keyword})}">
                          전체 <strong th:text="${totalCount}">0</strong>
                      </a>
                      <a th:classappend="${status == '진행 중'} ? ' is-active' : ''"
                        th:href="@{/inspections(keyword=${keyword}, status='진행 중')}">
                          진행 중 <strong th:text="${progressCount}">0</strong>
                      </a>
                      <a th:classappend="${status == '완료'} ? ' is-active' : ''"
                        th:href="@{/inspections(keyword=${keyword}, status='완료')}">
                          완료 <strong th:text="${completedCount}">0</strong>
                      </a>
                      <a th:classappend="${status == '진행 대기'} ? ' is-active' : ''"
                        th:href="@{/inspections(keyword=${keyword}, status='진행 대기')}">
                          진행 대기 <strong th:text="${pendingCount}">0</strong>
                      </a>
                  </nav>

                  <!-- 결과 없음 화면 -->
                  <div class="bv-blank bv-figma-empty" th:if="${resultCount == 0}">
                      <strong th:text="${totalCount == 0} ? '등록된 점검 내역이 없습니다.' : '검색 결과가 없습니다.'">검색 결과 없음</strong>
                      <p th:text="${totalCount == 0} ? '신규 점검 항목을 등록하여 관리해 보세요.' : '검색 조건을 바꾸거나 필터를 초기화해 주세요.'">안내</p>
                      <a class="bv-btn bv-btn-light" th:if="${totalCount > 0}" th:href="@{/inspections}">검색 초기화</a>
                  </div>

                  <!-- 점검 목록 카드 그리드 -->
                  <div class="bv-card-grid bv-figma-card-grid" th:if="${resultCount > 0}">
                      <a class="bv-maintenance-card" th:each="inspection, iter : ${rows}"
                        th:href="@{/inspections/{id}(id=${inspection.id})}">
                          
                          <div class="bv-card-visual" th:classappend="| bv-card-visual--${iter.index % 5}|">
                              <span class="bv-card-maintenance" aria-hidden="true"></span>
                              <span class="bv-card-deck" aria-hidden="true"></span>
                          </div>

                          <div class="bv-card-info">
                              <strong th:text="${inspection.keyword}">교량명</strong>
                              <span class="bv-card-type" th:text="${inspection.inspectionType}">정기점검</span>
                              <span class="bv-card-title" th:text="${#strings.isEmpty(inspection.safetyMemo) ? '상세 메모 없음' : inspection.safetyMemo}">점검 기록 내용</span>
                              <span class="bv-card-meta" th:text="|담당 ${inspection.inspector}|">담당자</span>
                              
                              <span class="bv-card-footer">
                                  <span class="bv-card-risk" th:text="|위험도: ${inspection.risk ?: '미평가'}|">위험도: 보통</span>
                                  <em class="bv-state" th:classappend="${inspection.status == '완료'} ? ' bv-state--done' : ''"
                                      th:text="${inspection.status}">진행 중</em>
                              </span>
                          </div>
                      </a>
                  </div>

                  <!-- 페이징 네비게이션 (경로를 /inspections 로 통일) -->
                  <nav class="bv-pager" aria-label="점검 목록 페이지 이동" th:if="${resultCount > 0}">
                      <a th:if="${hasPrev}"
                        th:href="@{/inspections(keyword=${keyword}, status=${status}, page=${pageNo - 1})}">이전</a>
                      <span th:unless="${hasPrev}" class="bv-disabled">이전</span>

                      <span th:text="|${pageNo} / ${totalPages}|">1 / 1</span>

                      <a th:if="${hasNext}"
                        th:href="@{/inspections(keyword=${keyword}, status=${status}, page=${pageNo + 1})}">다음</a>
                      <span th:unless="${hasNext}" class="bv-disabled">다음</span>
                  </nav>
              </section>
            </div>
        </main>

        <!-- <script src="/js/maintenance-list.js"></script> -->
    </div>
</body>
</html>
