<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교량점검 시스템</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/user-v2.css}" href="/css/user-v2.css">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="app-layout" th:with="activeMenu='users'">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="app-main user-v2" id="main-content">
            <div class="app-container">
                <!-- 서브메뉴 -->
                <div th:replace="~{fragments/submenu :: submenu(activeMenu='/users')}"></div>
                <h1 class="bv-title">관리자 권한 · 검수</h1>
                <p class="app-page-description">공통 헤더와 사이드바 연결 테스트 화면입니다.</p>

                <section class="app-grid" aria-label="화면 구성 미리보기">
                    <div class="app-card"><div class="app-stat-label">등록 교량</div><div class="app-stat-value">--</div></div>
                    <div class="app-card"><div class="app-stat-label">점검 진행 중</div><div class="app-stat-value">--</div></div>
                    <div class="app-card"><div class="app-stat-label">점검 완료</div><div class="app-stat-value">--</div></div>
                </section>
                <section class="app-card" style="margin-top:20px">
                    <h2 class="app-card__title">점검 목록</h2>
                    <p>공통 레이아웃이 정상적으로 표시된다면 1단계가 완료된 것입니다.</p>
                </section>
                <section class="bv-panel" aria-labelledby="cards-title">
        <div class="bv-section-heading"><div><h2 id="cards-title" class="bv-panel-title">점검 목록</h2><p class="bv-help" th:text="|검색 결과 ${resultCount}건 · ${pageNo}/${totalPages}페이지|">검색 결과 5건</p></div><a th:href="@{/users/new}" href="/users/new" class="bv-btn bv-btn-primary">신규 교량 등록</a></div>
        <div class="bv-blank" th:if="${totalCount == 0}"><strong>등록된 점검이 없습니다.</strong><p>신규 등록을 통해 등록하여 관리해 보세요.</p></div>
        <div class="bv-card-grid" th:if="${resultCount > 0}">
          <a class="bv-user-card" th:each="user,iter : ${rows}" th:href="@{/users/{no}(no=${user.no})}" href="/users/1">
            <div class="bv-card-visual" th:classappend="| bv-card-visual--${iter.index % 5}|" aria-hidden="true"><span class="bv-card-user"></span><span class="bv-card-deck"></span></div>
            <div class="bv-card-info"><strong th:text="${user.name}">점검1</strong><span th:text="|${user.province} ${user.city} · ${user.facilityType}|">경기도 가평군 · 제1종</span><span class="bv-card-footer"><time th:text="${#temporals.format(user.lastUserDate,'yyyy-MM-dd')}">2026-10-16</time><em class="bv-state" th:classappend="${user.status == '완료'} ? ' bv-state--done' : ''" th:text="${user.status}">진행 중</em></span></div>
          </a>
        </div>
        <div class="bv-blank" th:if="${totalCount > 0 and resultCount == 0}"><strong>검색 결과 없음</strong><p>다른 조건으로 검색하거나 필터를 초기화해 주세요.</p><a class="bv-btn bv-btn-light" th:href="@{/users}" href="/users">검색 초기화</a></div>
        <nav class="bv-pager" aria-label="교량 페이지 이동" th:if="${resultCount > 0}">
          <a th:if="${hasPrev}" th:href="@{/users(keyword=${keyword},year=${year},month=${month},province=${province},city=${city},facilityType=${facilityType},sort=${sort},page=${pageNo - 1})}">이전</a><span th:unless="${hasPrev}" class="bv-disabled">이전</span>
          <span th:text="|${pageNo} / ${totalPages}|">1 / 1</span>
          <a th:if="${hasNext}" th:href="@{/users(keyword=${keyword},year=${year},month=${month},province=${province},city=${city},facilityType=${facilityType},sort=${sort},page=${pageNo + 1})}">다음</a><span th:unless="${hasNext}" class="bv-disabled">다음</span>
        </nav>
      </section>
            </div>
        </main>
    </div>
</body>
</html>
