spring.application.name=project

# 데이터베이스 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/aloha
spring.datasource.username=aloha
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# ddl-auto : create / update / validate / none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# 로깅
spring.output.ansi.enabled=ALWAYS
logging.level.root=INFO
logging.level.com.aloha.shop=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n


# 국세청 사업자등록정보 진위확인 API
nts.api.base-url=https://api.odcloud.kr/api/nts-businessman/v1
nts.api.service-key=${ODCLOUD_SERVICE_KEY}