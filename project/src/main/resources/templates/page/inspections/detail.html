<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교량점검 시스템</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/inspection-v2.css}" href="/css/inspection-v2.css">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="app-layout" th:with="activeMenu='inspections'">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <main class="app-main inspection-v2" id="main-content">
            <div class="app-container">
                <!-- 서브메뉴 -->
                <div th:replace="~{fragments/submenu :: submenu(activeMenu='/inspections/5')}"></div>
                <h1 class="bv-title">점검 상세</h1>
                <p class="app-page-description">점검 상세 기능은 준비 중입니다.</p>

                <section class="app-card" aria-labelledby="inspection-detail-pending">
                    <h2 class="app-card__title" id="inspection-detail-pending">점검 상세 화면 준비 중</h2>
                    <p>점검 기록 기능이 완성되면 이곳에서 점검 내용과 첨부 영상을 확인할 수 있습니다.</p>
                    <p><a th:href="@{/inspections}" href="/inspections">점검 목록으로 돌아가기</a></p>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
