# 발표용 Mock 인증 프로필: 외부 국세청 API를 호출하지 않습니다.
spring.application.name=project

# 데이터베이스 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/project
spring.datasource.username=aloha
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# ddl-auto : create / update / validate / none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# 로깅
spring.output.ansi.enabled=ALWAYS
logging.level.root=INFO
logging.level.com.aloha.project=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n

# 업로드 데이터는 프로젝트 소스 폴더 밖 보관
# 교량 대표 이미지 저장 경로
bridge.images.storage-dir=./uploads/bridge-images

# 점검·유지보수 첨부파일(/api/media) 저장 경로
media.storage-dir=./uploads/media

# 유지보수 증거 사진 1장당 최대 5MB
maintenance.photos.max-bytes=5242880

# 유지보수 드론 영상 저장 경로
maintenance.videos.storage-dir=./uploads/maintenance-videos

# 유지보수 영상 최대 크기 (200MB)
maintenance.videos.max-bytes=209715200

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB